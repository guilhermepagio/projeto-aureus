spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[tenant_identifier_resolver]": com.guilhermepagio.aureus.backend.security.CurrentTenantIdentifierResolverImpl
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  frontend:
    url: ${FRONTEND_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [req:%X{requestId:-} tenant:%X{tenantId:-}]"
